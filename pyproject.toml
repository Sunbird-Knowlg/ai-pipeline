[project]
name = "sunbird-ai-platform"
version = "0.1.0"
description = "Sunbird AI Flink jobs — enrichment-router and caption-generator"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = [
    "core/tests",
    "jobs/enrichment_router/tests",
    "jobs/caption_generator/tests",
]
markers = [
    "integration: requires local docker-compose stack (JanusGraph, Kafka, Azurite)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
