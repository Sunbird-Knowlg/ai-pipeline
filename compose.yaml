# Infrastructure + core-api. Workflow/service runtimes are started by `pnpm pipeline deploy`
# as containers on the same network (immutable deployments: one container per build).
name: ai-pipeline-restate

networks:
  default:
    name: ai-pipeline

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Provisioning: the databases and the catalogue schema. The official image runs these once,
      # against an empty data directory — the API never creates tables.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U pipeline -d pipeline']
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      # Persist to the mounted volume (the image default is /tmp/kafka-logs) with a fixed KRaft
      # cluster id, so topics and consumer offsets survive container re-creation.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - 127.0.0.1:29092:29092
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic content.published --partitions 3 --replication-factor 1
    restart: 'no'

  restate:
    image: docker.restate.dev/restatedev/restate:1.7.10
    restart: unless-stopped
    environment:
      RESTATE_NODE_NAME: restate-1
      RESTATE_LOG_FILTER: restate=info
      RESTATE_TRACING_ENDPOINT: otlp+http://otel:4318/v1/traces
      DO_NOT_TRACK: '1'
    volumes:
      - restate-data:/restate-data
    # 9070 = admin API + UI. The 8080 ingress stays internal: REST goes through core-api.
    ports:
      - 127.0.0.1:9070:9070
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9070/health']
      interval: 3s
      timeout: 3s
      retries: 40

  litellm:
    image: ghcr.io/berriai/litellm:v1.101.0
    restart: unless-stopped
    command: ['--config', '/app/config.yaml', '--host', '0.0.0.0', '--port', '4000']
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      LITELLM_TELEMETRY: 'false'
      DO_NOT_TRACK: '1'
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:4000:4000
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  otel:
    image: otel/opentelemetry-collector-contrib:0.161.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:4318:4318

  core-api:
    build:
      context: .
      args:
        PACKAGE: '@ai-pipeline/core-api'
    image: ai-pipeline/core-api:dev
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://pipeline@postgres:5432/pipeline
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RESTATE_INGRESS_URL: http://restate:8080
      RESTATE_ADMIN_URL: http://restate:9070
      KAFKA_CLUSTER_NAME: local
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      OTEL_SERVICE_NAME: core-api
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      restate:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  kafka-data:
  restate-data:
