name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - job: enrichment-router
            dockerfile: docker/Dockerfile.enrichment-router
          - job: caption-generator
            dockerfile: docker/Dockerfile.caption-generator
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/sunbird/${{ matrix.job }}:latest
            ghcr.io/sunbird/${{ matrix.job }}:${{ github.sha }}
