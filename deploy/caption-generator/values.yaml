image:
  repository: sunbird/caption-generator
  tag: "0.1.0"

parallelism: 4

kafka:
  brokers: ""
  topics:
    transcriptionIn: ""
    multilingualIn: ""
    transcriptionDlq: ""
    multilingualDlq: ""

janusgraph:
  host: ""
  port: 8182

schema:
  basePath: ""

knowlg:
  contentServiceUrl: ""
  apiKeySecretRef: knowlg-api-key

storage:
  type: azure
  authType: OIDC
  container: ""

transcription:
  provider: faster_whisper
  model: large-v3-turbo
  device: cpu
  computeType: int8
  autoApprove: false

multilingual:
  provider: litellm
  model: ""
  apiKeySecretRef: llm-api-key
  batchSize: 80
  contextOverlap: 2
  autoApprove: true
  ecar:
    # Infra-configurable: whether a permanently failed language blocks ECAR
    # generation for the whole content item, or is skipped so the ECAR still
    # builds from whatever languages succeeded.
    allowFailedLanguages: true

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"
